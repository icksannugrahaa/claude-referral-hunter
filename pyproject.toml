[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "claude-referral-hunter"
dynamic = ["version"]
description = "Find fresh Claude referral links (X, Telegram, Reddit, Threads, HN…) and push them to Telegram, WhatsApp (Cloud API or OpenWA), Discord or any webhook."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Icksan Nugraha" }]
keywords = ["claude", "anthropic", "referral", "telegram-bot", "whatsapp", "openwa", "notifier"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
telegram = ["telethon>=1.36"]
# X needs a patched twikit (upstream 2.3.3 broke on X's 2026-03 web changes):
#   pip install -r requirements-x.txt
x = ["twikit>=2.3"]
dev = ["pytest>=8"]

[project.scripts]
claude-referral-hunter = "claude_referral_hunter.cli:main"

[project.urls]
Homepage = "https://github.com/icksannugrahaa/claude-referral-hunter"

[tool.hatch.version]
path = "src/claude_referral_hunter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_referral_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
